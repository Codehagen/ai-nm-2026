[project]
name = "ai-nm-2026"
version = "0.1.0"
description = "NM i AI 2026 competition harness"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "torch>=2.0",
    "transformers>=4.40",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "optuna>=3.6",
    "wandb>=0.17",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "httpx>=0.27",
    "pytest>=8.0",
    "cloudml-hypertune>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tasks"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
